<!doctype html>
<!-- Template for docs/og-image.jpg (1200x630 social card). Rendered by tools/make-og.js -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cinzel;src:url(../docs/assets/fonts/Cinzel-400-900.woff2) format('woff2');font-weight:400 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0d0b12;position:relative;font-family:Cinzel,serif;color:#f5f0e9}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:18% 40%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,11,18,0) 25%,rgba(13,11,18,.6) 55%,rgba(13,11,18,.85) 100%),linear-gradient(0deg,rgba(13,11,18,.5),transparent 35%)}
.copy{position:absolute;right:56px;top:50%;transform:translateY(-50%);width:560px;text-align:center}
.copy img{width:100%;filter:drop-shadow(0 6px 24px rgba(0,0,0,.8))}
.line{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:26px;font-weight:600;font-size:17px;letter-spacing:.24em;white-space:nowrap;text-transform:uppercase}
.line::before,.line::after{content:"";flex:none;width:36px;height:1px;background:linear-gradient(90deg,transparent,#d9a35a)}
.line::after{transform:scaleX(-1)}
.by{margin-top:16px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#f0c27a}
</style></head>
<body>
<img class="art" src="../docs/assets/img/keyart-1280.webp" alt="">
<div class="shade"></div>
<div class="copy">
  <img src="../docs/assets/img/wordmark-black-flame.webp" alt="">
  <div class="line">A dark fantasy game series</div>
  <div class="by">by Emberfish Games</div>
</div>
</body></html>
